<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen VPN & Perangkat</title>
    <style>
        /* Reset & Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000; /* Latar belakang hitam pekat iOS */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Bagian Header (Tombol Back & Judul) */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 16px;
            position: relative;
        }

        .back-btn {
            background-color: #1c1c1e;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        /* Membuat icon panah menggunakan CSS */
        .back-btn::before {
            content: '';
            border: solid white;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 4px;
            transform: rotate(135deg);
            margin-left: 4px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 17px;
            font-weight: 600;
        }

        /* Area Konten */
        .content {
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Jarak antar kotak menu */
        }

        /* Desain Kotak Menu (List Item) */
        .list-item {
            background-color: #1c1c1e; /* Warna abu-abu gelap iOS */
            border-radius: 14px; /* Sudut membulat */
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .list-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Ikon Bumi (VPN) */
        .icon-vpn {
            background-color: #000000;
            border: 1px solid #333;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .item-text {
            font-size: 16px;
        }

        /* Teks Status (Tidak Terhubung) */
        .item-status {
            color: #8e8e93; /* Warna teks abu-abu */
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Panah Kanan (Chevron) */
        .chevron {
            border: solid #8e8e93;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 3px;
            transform: rotate(-45deg);
            margin-left: 4px;
        }

        /* Desain tombol teks biru (Masuk ke akun...) */
        .text-button {
            background-color: #1c1c1e;
            border-radius: 14px;
            padding: 14px 16px;
            color: #0a84ff; /* Biru khas iOS */
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="back-btn"></div>
        <div class="header-title">Manajemen VPN & Perangkat</div>
    </div>

    <!-- Konten Menu -->
    <div class="content">
        
        <!-- Menu VPN -->
        <div class="list-item">
            <div class="list-item-left">
                <!-- Icon menggunakan emoji atau SVG, di sini pakai emoji bola dunia -->
                <div class="icon-vpn">🌐</div>
                <div class="item-text">VPN</div>
            </div>
            <div class="item-status">
                Tidak Terhubung <div class="chevron"></div>
            </div>
        </div>

        <!-- Tombol Akun Kantor/Sekolah -->
        <div class="text-button">
            Masuk ke Akun Kantor atau Sekolah...
        </div>

    </div>

</body>
</html>
