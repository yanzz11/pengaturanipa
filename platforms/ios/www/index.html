<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manajemen VPN</title>
    <style>
        /* Reset & Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 0 16px;
            padding-top: max(env(safe-area-inset-top, 20px), 60px); 
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            height: 40px;
        }

        .back-button {
            width: 38px;
            height: 38px;
            background-color: #1c1c1e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            left: 0;
            z-index: 2;
        }

        /* Panah kiri */
        .back-button::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-left: 2.5px solid #ffffff;
            border-bottom: 2.5px solid #ffffff;
            transform: rotate(45deg);
            margin-left: 4px;
        }

        .header-title {
            width: 100%;
            text-align: center;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin: 0 45px;
        }

        /* --- GRUP MENU --- */
        .menu-group {
            background-color: #1c1c1e;
            border-radius: 22px; 
            margin-bottom: 24px;
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            position: relative;
        }

        /* --- IKON VPN (BUMI BIRU DI HITAM) --- */
        .icon-vpn {
            width: 32px;
            height: 32px;
            background-color: #000000; 
            border: 1px solid #2c2c2e; 
            border-radius: 9px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        /* SVG Garis Bumi Biru */
        .icon-vpn svg {
            width: 24px;
            height: 24px;
            stroke: #0a84ff; 
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- TEKS --- */
        .menu-text {
            flex-grow: 1;
            font-size: 17px;
            letter-spacing: -0.4px;
        }

        .menu-status {
            color: #8e8e93;
            font-size: 17px;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
        }

        /* Panah Kanan (>) */
        .chevron::after {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-top: 2.5px solid #5c5c5e;
            border-right: 2.5px solid #5c5c5e;
            transform: rotate(45deg);
            margin-left: 10px;
            margin-bottom: 2px;
        }

        .text-blue {
            color: #0a84ff;
            font-size: 17px;
            letter-spacing: -0.4px;
        }

        .menu-item:active {
            background-color: #2c2c2e;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="back-button" onclick="history.back()"></div>
        <div class="header-title">Manajemen VPN & Perangkat</div>
    </div>

    <!-- MENU 1 -->
    <div class="menu-group">
        <a href="#" class="menu-item">
            <div class="icon-vpn">
                <!-- SVG Bumi Bertangkai (Garis Biru, Kaki Lebih Panjang) -->
                <svg viewBox="0 0 24 24">
                    <!-- Lingkaran Bumi -->
                    <circle cx="12" cy="10.5" r="7"></circle>
                    <!-- Garis Vertikal Bumi -->
                    <path d="M12 3.5v14"></path>
                    <!-- Garis Horizontal Bumi -->
                    <path d="M5 10.5h14"></path>
                    <!-- Lengkungan Bumi Kiri -->
                    <path d="M12 3.5a10 10 0 0 0 0 14"></path>
                    <!-- Lengkungan Bumi Kanan -->
                    <path d="M12 3.5a10 10 0 0 1 0 14"></path>
                    <!-- Tangkai Bawah (Lebih Panjang) -->
                    <path d="M12 17.5v3"></path>
                    <!-- Garis Horizontal Bawah -->
                    <path d="M8.5 20.5h7"></path>
                    <!-- Titik di Tengah Tangkai -->
                    <circle cx="12" cy="20.5" r="1.2" fill="#0a84ff" stroke="none"></circle>
                </svg>
            </div>
            <div class="menu-text">VPN</div>
            <div class="menu-status chevron">Tidak Terhubung</div>
        </a>
    </div>

    <!-- MENU 2 -->
    <div class="menu-group">
        <a href="#" class="menu-item">
            <div class="menu-text text-blue">Masuk ke Akun Kantor atau Sekolah...</div>
        </a>
    </div>

</body>
</html>
